<html lang="th">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Agency Attendance · WFDC</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* ===== พนักงาน ===== */
:root{--bg:#F3F5F7; --surface:#FFFFFF; --ink:#0F1E2E; --ink2:#33475B; --muted:#5B6B7B; --faint:#8795A3;
  --line:#E2E7EC; --line2:#D5DCE3; --navy:#13324F; --navy2:#1F4A70;
  --green:#0B8457; --green-ink:#0B6E4A; --green-soft:#E3F4EC;
  --orange:#B54708; --orange-soft:#FEF0E1; --red:#C0262D; --red-soft:#FDE8E8;
  --amber-ink:#7A4A00; --amber-soft:#FFF1D6; --blue-soft:#CFE0F5; --blue-ink:#1E3A5F; --gray-soft:#E2E7EC;
  --radius:16px;}
*{box-sizing:border-box}
html,body.m-emp{margin:0;height:100%}
body.m-emp{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','Noto Sans Myanmar',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.m-emp button,body.m-emp input,body.m-emp select,body.m-emp textarea{font:inherit;color:inherit}
body.m-emp button{cursor:pointer}
body.m-emp button:disabled{cursor:not-allowed}
body.m-emp a{color:var(--green-ink)}
body.m-emp .hidden{display:none!important}
body.m-emp .num{font-variant-numeric:tabular-nums}
body.m-emp .shell{min-height:100%;display:flex;flex-direction:column}
body.m-emp .topbar{display:none}
body.m-emp .main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px 96px;display:flex;flex-direction:column;gap:14px}
body.m-emp .bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
body.m-emp .bottomnav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
body.m-emp .bottomnav button.on{color:var(--green-ink);font-weight:600}
@media (min-width:900px){body.m-emp .topbar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:0 32px;min-height:64px}
body.m-emp .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700}
body.m-emp .topbar nav{display:flex;gap:4px;flex:1}
body.m-emp .topbar nav button{height:38px;padding:0 16px;border-radius:9px;border:none;background:none;color:#C9D6E2;font-size:14px}
body.m-emp .topbar nav button.on{background:var(--navy2);color:#fff;font-weight:600}
body.m-emp .bottomnav{display:none}
body.m-emp .main{max-width:1200px;padding:24px 32px 40px}
body.m-emp .main.narrow{max-width:620px}}
body.m-emp .card{background:var(--surface);border-radius:var(--radius);padding:16px 18px}
body.m-emp .row{display:flex;align-items:center;gap:12px}
body.m-emp .col{display:flex;flex-direction:column}
body.m-emp .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.m-emp .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
body.m-emp .h1{font-size:22px;font-weight:700;margin:0}
body.m-emp .lbl{font-size:12px;color:var(--muted)}
body.m-emp .sub{font-size:13px;color:var(--muted)}
body.m-emp .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
body.m-emp .chip.ok{background:var(--green-soft);color:var(--green-ink)}
body.m-emp .chip.bad{background:var(--red-soft);color:#A3161D}
body.m-emp .chip.warn{background:var(--orange-soft);color:var(--orange)}
body.m-emp .chip.info{background:#E8F0FA;color:var(--blue-ink)}
body.m-emp .chip.gray{background:#EEF1F4;color:var(--ink2)}
body.m-emp .chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
body.m-emp .btn{height:52px;border-radius:14px;border:none;padding:0 18px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
body.m-emp .btn.big{height:64px;border-radius:18px;font-size:19px}
body.m-emp .btn.primary{background:var(--green);color:#fff}
body.m-emp .btn.navy{background:var(--navy);color:#fff}
body.m-emp .btn.ghost{background:var(--surface);border:1.5px solid var(--line2);color:var(--ink2)}
body.m-emp .btn:disabled{opacity:.45}
body.m-emp .btn.ghost:disabled{opacity:1;color:var(--faint)}
body.m-emp .field{display:flex;flex-direction:column;gap:6px}
body.m-emp .field label{font-size:14px;font-weight:600}
body.m-emp .input{height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);padding:0 14px;font-size:17px;width:100%}
body.m-emp .input:focus{outline:none;border-color:var(--green)}
body.m-emp textarea.input{height:auto;min-height:72px;padding:10px 14px;font-size:15px}
body.m-emp .seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--gray-soft);border-radius:12px;padding:3px}
body.m-emp .seg button{height:36px;border:none;border-radius:10px;background:none;color:var(--ink2);font-size:14px}
body.m-emp .seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
body.m-emp .pillbtn{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;color:var(--navy)}
body.m-emp .iconbtn{width:44px;height:44px;border-radius:22px;border:none;display:inline-flex;align-items:center;justify-content:center}
body.m-emp .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99;max-width:92vw;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
body.m-emp .toast.err{background:var(--red)}
body.m-emp .spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
body.m-emp .spinner.dark{border-color:rgba(19,50,79,.2);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
body.m-emp .sk{background:linear-gradient(90deg,#E7ECF2 0%,#F5F7FA 40%,#E7ECF2 80%);background-size:300% 100%;animation:shimmer 1.3s linear infinite;border-radius:8px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.m-emp .slide-l{animation:sl .32s cubic-bezier(.2,.8,.2,1) both}
body.m-emp .slide-r{animation:sr .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
body.m-emp .pdot{width:9px;height:9px;border-radius:50%;background:currentColor;position:relative;flex:none;display:inline-block}
body.m-emp .pdot::before,body.m-emp .pdot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;animation:ping 1.6s ease-out infinite}
body.m-emp .pdot::after{animation-delay:.8s}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
body.m-emp .camflash{position:fixed;inset:0;background:#fff;z-index:300;pointer-events:none;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
body.m-emp .okcheck{width:64px;height:64px;flex:none}
body.m-emp .okcheck circle{fill:#E3F4EC;stroke:#0B8457;stroke-width:5;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .55s ease-out forwards}
body.m-emp .okcheck path{fill:none;stroke:#0B8457;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s ease-out .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
body.m-emp .pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,body.m-emp *::before,body.m-emp *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body.m-emp .lang{display:flex;gap:6px}
body.m-emp .lang button{height:34px;padding:0 12px;border-radius:17px;border:1px solid #4A6681;background:transparent;color:#fff;font-size:13px}
body.m-emp .lang button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
body.m-emp .lang.light button{border-color:var(--line2);color:var(--ink2)}
body.m-emp .lang.light button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.m-emp .auth{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;align-items:center}
body.m-emp .auth-in{width:100%;max-width:460px;flex:1;display:flex;flex-direction:column}
body.m-emp .auth-head{padding:24px 26px 30px;color:#fff;display:flex;flex-direction:column;gap:12px}
body.m-emp .auth-body{flex:1;background:var(--bg);border-radius:28px 28px 0 0;padding:26px 22px 30px;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){body.m-emp .auth{justify-content:center}
body.m-emp .auth-in{flex:none}
body.m-emp .auth-body{border-radius:28px}}
body.m-emp .logo{width:54px;height:54px;border-radius:16px;background:var(--green);display:flex;align-items:center;justify-content:center}
body.m-emp .clock{font-size:56px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
body.m-emp .geo{display:flex;align-items:center;gap:16px}
@media (min-width:900px){body.m-emp .home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}}
body.m-emp .cam{position:fixed;inset:0;z-index:40;background:#0B141D;color:#fff;display:flex;flex-direction:column;padding:14px 16px calc(20px + env(safe-area-inset-bottom));gap:12px;overflow:auto}
body.m-emp .cam-in{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1}
body.m-emp .shiftbtn{height:58px;border-radius:14px;border:1.5px solid #33475B;background:#15212D;color:#D5DEE6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600}
body.m-emp .shiftbtn.on{border:2px solid #2BC48A;background:#12402F;color:#fff}
body.m-emp .shiftbtn small{font-size:11px;color:#9BE8C6;font-weight:500}
body.m-emp .viewer{position:relative;flex:1;min-height:300px;border-radius:22px;overflow:hidden;background:#26394A}
body.m-emp .viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
body.m-emp .viewer .oval{position:absolute;left:50%;top:44%;width:58%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.8);border-radius:50%}
body.m-emp .viewer .badge{position:absolute;top:12px;left:12px}
body.m-emp .wm{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.55);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
body.m-emp .wm .t{font-size:32px;font-weight:700;line-height:1}
body.m-emp .wm .bar{width:3px;height:30px;background:#F5B700;border-radius:2px}
body.m-emp .blocked{position:absolute;inset:0;background:#1A2530;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
body.m-emp .shutter{width:82px;height:82px;border-radius:41px;border:4px solid #2BC48A;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
body.m-emp .shutter span{width:64px;height:64px;border-radius:32px;background:#fff;display:block}
body.m-emp .shutter:disabled{border-color:#33475B}
body.m-emp .shutter:disabled span{background:#33475B}
body.m-emp .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
body.m-emp .cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
body.m-emp .cell{height:52px;border-radius:9px;padding:3px 1px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#fff;color:var(--faint);font-size:11px;line-height:1.05}
body.m-emp .cell .d{font-weight:600}
body.m-emp .cell .c{font-size:10px;font-weight:700}
body.m-emp .cell .t{font-size:9px}
body.m-emp .cell .range,body.m-emp .cell .pill{display:none}
body.m-emp .cell.sel{box-shadow:0 0 0 2px var(--navy)}
body.m-emp .k-work{background:var(--blue-soft);color:var(--blue-ink)}
body.m-emp .k-late{background:var(--orange-soft);color:#8A3505}
body.m-emp .k-missing{background:var(--red-soft);color:#A3161D;border-color:var(--red)}
body.m-emp .k-holiday{background:var(--amber-soft);color:var(--amber-ink)}
body.m-emp .k-off{background:var(--gray-soft);color:var(--ink2)}
body.m-emp .k-leave{background:#F1E8FA;color:#5B2A86}
body.m-emp .k-ab{background:var(--red);color:#fff}
body.m-emp .k-today,body.m-emp .k-working{background:var(--green-soft);color:#0B4F36;border:2px solid var(--green)}
body.m-emp .k-future{background:#fff;border:1px dashed #C5CED7}
body.m-emp .k-out{background:transparent;color:#C5CED7}
body.m-emp .k-ab .pill,body.m-emp .k-ab .c{background:rgba(255,255,255,.22)!important;color:#fff}
body.m-emp .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
body.m-emp .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
body.m-emp .dayrow{background:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px}
body.m-emp .code{min-width:46px;height:28px;padding:0 6px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
body.m-emp .photo-thumb{height:84px;border-radius:10px;background:#4C6478;object-fit:cover;width:100%}
body.m-emp .photo-none{height:84px;border-radius:10px;border:1.5px dashed #C5CED7;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}
@media (min-width:900px){body.m-emp .mt-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
body.m-emp .cal{gap:6px}
body.m-emp .cell{height:auto;min-height:104px;align-items:flex-start;justify-content:flex-start;gap:5px;padding:8px;font-size:14px;border-radius:12px;text-align:left}
body.m-emp .cell .top{display:flex;justify-content:space-between;width:100%}
body.m-emp .cell .c{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.7)}
body.m-emp .cell .t{display:none}
body.m-emp .cell .range{display:block;font-size:13px;font-weight:600}
body.m-emp .cell .pill{display:block;align-self:stretch;font-size:11px;font-weight:600;padding:3px 6px;border-radius:6px;background:#fff}
body.m-emp .cal .wd{font-size:13px;font-weight:600}}
@media (max-width:899px){body.m-emp .cell .top{display:contents}}
@media (min-width:900px){body.m-emp .hide-desk,body.m-emp .hide-desk-btn{display:none!important}}
@media (max-width:899px){body.m-emp .hide-mobile-tiles{display:none}}
/* ===== Admin ===== */
:root{--bg:#F3F5F7; --surface:#fff; --ink:#0F1E2E; --ink2:#33475B; --muted:#5B6B7B; --faint:#8795A3; --line:#E2E7EC; --line2:#D5DCE3;
  --navy:#13324F; --navy2:#1F4A70; --green:#0B8457; --green-ink:#0B6E4A; --green-soft:#E3F4EC; --orange:#B54708; --orange-soft:#FEF0E1;
  --red:#C0262D; --red-soft:#FDE8E8; --amber-ink:#7A4A00; --amber-soft:#FFF1D6; --blue-soft:#CFE0F5; --blue-ink:#1E3A5F; --gray-soft:#E2E7EC;}
*{box-sizing:border-box}
html,body.m-adm{margin:0;min-height:100%}
body.m-adm{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.m-adm button,body.m-adm input,body.m-adm select,body.m-adm textarea{font:inherit;color:inherit}
body.m-adm button{cursor:pointer}
body.m-adm a{color:var(--green-ink)}
body.m-adm .hidden{display:none!important}
body.m-adm .num{font-variant-numeric:tabular-nums}
body.m-adm .layout{display:flex;flex-wrap:wrap;min-height:100vh}
body.m-adm .side{flex:1 1 220px;max-width:248px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
body.m-adm .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
body.m-adm .side button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;border:none;background:none;color:#C9D6E2;font-size:14px;text-align:left}
body.m-adm .side button.on{background:var(--navy2);color:#fff;font-weight:600}
body.m-adm .content{flex:999 1 560px;min-width:0;padding:26px 30px 90px;display:flex;flex-direction:column;gap:18px}
body.m-adm .mtop{display:none}
body.m-adm .acct-btn{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:#1F4A70;color:#fff;font-weight:700;font-size:16px;flex:none}
body.m-adm .acct-ov{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:60;animation:fadein .15s ease both}
body.m-adm .acct-pop{position:fixed;top:74px;right:12px;width:min(300px,calc(100vw - 24px));background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.25);z-index:61;overflow:hidden;transform-origin:top right;animation:acctin .18s cubic-bezier(.2,.8,.2,1) both}
body.m-adm .acct-pop .ar{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;font-size:15px;font-weight:600;border:none;border-top:1px solid #EEF1F4;background:#fff;text-align:left;color:var(--ink)}
@keyframes acctin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
body.m-adm .mnav{display:none}
@media (max-width:860px){body.m-adm .side{display:none}
body.m-adm .mtop{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:16px 18px;width:100%}
body.m-adm .content{padding:16px 14px 96px}
body.m-adm .mtop select{color:var(--ink)}
body.m-adm .mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid var(--line);z-index:20}
body.m-adm .mnav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
body.m-adm .mnav button.on{color:var(--green-ink);font-weight:600}}
body.m-adm .h1{margin:0;font-size:26px;font-weight:700}
body.m-adm .h2{margin:0;font-size:17px;font-weight:700}
body.m-adm .sub{font-size:14px;color:var(--muted)}
body.m-adm .lbl{font-size:12px;color:var(--muted)}
body.m-adm .card{background:#fff;border-radius:16px;padding:18px 20px}
body.m-adm .row{display:flex;align-items:center;gap:10px}
body.m-adm .wrap{flex-wrap:wrap}
body.m-adm .col{display:flex;flex-direction:column}
body.m-adm .between{justify-content:space-between}
body.m-adm .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
body.m-adm .kpi{background:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
body.m-adm .kpi b{font-size:30px;line-height:1.1}
body.m-adm .btn{height:40px;padding:0 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
body.m-adm .btn.primary{background:var(--green);color:#fff}
body.m-adm .btn.navy{background:var(--navy);color:#fff}

<script>
/* ===== Agency Attendance (WFDC MKD2) · หน้าเดียว: พนักงาน + Admin · CJ IT By Nutdanai Pathsith ===== */
const SUPABASE_URL = 'https://ttemsbwugnqydxfgwudf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dug1Z0767MzSN7AaYvwllQ_-M_s2Yrr';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
/* ===== Calc engine (shared: app.html + admin.html) — คิดรหัสรายวัน / OT / เงิน ===== */
const Calc = (() => {
  const BKK = 7 * 3600e3;
  const DAY = 864e5;
  const pad = (n) => String(n).padStart(2, '0');
  const ms = (t) => (t == null ? null : typeof t === 'number' ? t : new Date(t).getTime());

  function bkkParts(t) {
    const d = new Date(ms(t) + BKK);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mi: d.getUTCMinutes(), ss: d.getUTCSeconds(), dow: d.getUTCDay() };
  }
  const bkkDate = (t) => { const p = bkkParts(t); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; };
  const bkkTime = (t) => { if (t == null) return ''; const p = bkkParts(t); return `${pad(p.hh)}:${pad(p.mi)}`; };
  const parseD = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const addDays = (s, n) => new Date(parseD(s) + n * DAY).toISOString().slice(0, 10);
  const dow = (s) => new Date(parseD(s)).getUTCDay();
  const at = (dateStr, hhmm) => parseD(dateStr) + (+hhmm.slice(0, 2)) * 3600e3 + (+hhmm.slice(3, 5)) * 60e3 - BKK;

  function cycleOf(dateStr, startDay) {
    startDay = startDay || 26;
    let y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7);
    const d = +dateStr.slice(8, 10);
    if (d < startDay) { m -= 1; if (m < 1) { m = 12; y -= 1; } }
    const from = `${y}-${pad(m)}-${pad(startDay)}`;
    let y2 = y, m2 = m + 1; if (m2 > 12) { m2 = 1; y2 += 1; }
    const to = addDays(`${y2}-${pad(m2)}-${pad(startDay)}`, -1);
    return { from, to };
  }
  const shiftCycle = (cyc, n, startDay) => cycleOf(addDays(n < 0 ? cyc.from : cyc.to, n < 0 ? -1 : 1), startDay);

  function shiftWindow(sh, workDate) {
    const start = at(workDate, sh.start_time);
    let end = at(workDate, sh.end_time);
    if (end <= start) end += DAY;
    return { start, end };
  }

  /* ใบลาที่ครอบคลุมวันนั้น (active, ล่าสุดก่อน) */
  function reqOn(requests, date) {
    let best = null;
    for (const r of requests) {
      if (r.status !== 'active' || date < r.date_from || date > r.date_to) continue;
      if (!best || r.created_at > best.created_at) best = r;
    }
    return best;
  }

  /**
   * คิดทั้งรอบของพนักงาน 1 คน
   * opts: {emp, from, to, attendance[], requests[], holidays{date:name}, shifts{code:row}, settings, now}
   */
  // พัก OT ตาม พ.ร.บ.คุ้มครองแรงงาน ม.27 วรรคสี่: OT ที่ปัดแล้วเกิน 2 ชม. หัก 30 นาที (ค่าตายตัว)
  const OT_BREAK_AFTER = 120, OT_BREAK_MIN = 30;
  function computeEmployee(o) {
    const s = o.settings || {};
    const grace = +(s.grace_minutes ?? 5);
    const otMin = +(s.ot_min_minutes ?? 60);
    const otStep = Math.max(1, +(s.ot_step_minutes ?? 30));
    const missH = +(s.missing_after_hours ?? 4);
    const hHours = +(s.holiday_hours ?? 8);
    const rates = s.rates || {};
    const now = ms(o.now) || Date.now();
    const today = bkkDate(now);
    const emp = o.emp;
    const byDate = {};
    for (const a of o.attendance) if (a.emp_id === emp.emp_id) (byDate[a.work_date] = byDate[a.work_date] || []).push(a);
    const reqs = o.requests.filter((r) => r.emp_id === emp.emp_id);
    const days = [];
    const sum = { worked: 0, ot1: 0, ot15: 0, ot2: 0, ot3: 0, fee: 0, extra: 0, phDays: 0, late: 0, lateMin: 0, missing: 0, AB: 0, H: 0, PL: 0, SL: 0, WOP: 0, holidayWork: 0, preOt: 0, otBreak: 0, earlyCount: 0, earlyH: 0, slH: 0, plH: 0, bossH: 0 };

    for (let date = o.from; date <= o.to; date = addDays(date, 1)) {
      const hol = o.holidays[date] || null;
      const req = reqOn(reqs, date);
      const list = (byDate[date] || []).slice().sort((x, y) => ms(x.in_at) - ms(y.in_at));
      const a = list[0] || null;
      const day = { date, dow: dow(date), code: '', kind: 'none', holiday: hol, request: req, att: a, extraAtt: list.slice(1),
        shift: null, inAt: a ? a.in_at : null, outAt: a ? a.out_at : null,
        late: 0, early: 0, ot1: 0, ot15: 0, ot2: 0, ot3: 0, fee: 0, worked: 0, extra: 0, ph: false, otBreak: 0, notes: [] };
      const beforeStart = emp.start_date && date < emp.start_date;
      const resigned = emp.status === 'Resign' && emp.resign_date && date >= emp.resign_date;

      if (a) {
        const sh = o.shifts[a.shift_code] || { ts_code: a.shift_code, start_time: '08:00', end_time: '17:00', fee: 0 };
        const win = shiftWindow(sh, date);
        const type = hol ? 'PH' : (req && req.code === 'H') ? 'H' : 'N';
        day.shift = a.shift_code;
        day.code = type === 'N' ? sh.ts_code : type + sh.ts_code + '8';
        day.kind = type === 'N' ? 'work' : 'holiday';
        const lateMin = Math.floor((ms(a.in_at) - win.start) / 60e3);
        if (lateMin > grace) { day.late = lateMin; sum.late++; sum.lateMin += lateMin; day.notes.push('late'); }
        if (a.out_at) {
          // OT แต่ละช่วง (ก่อนกะ / หลังกะ): ปัดลงทีละ step ก่อน → ไม่ถึงขั้นต่ำ = 0 → ปัดแล้วเกิน 2 ชม. หักพัก 30 นาที (ม.27)
          const otPart = (gapMs) => {
            const r = Math.floor(Math.floor(gapMs / 60e3) / otStep) * otStep;
            if (r <= 0 || r < otMin) return [0, 0];
            const brk = r > OT_BREAK_AFTER ? OT_BREAK_MIN : 0;
            return [r - brk, brk];
          };
          const [otm, brkPost] = otPart(ms(a.out_at) - win.end);
          // OT ก่อนเข้ากะ: มาก่อนเวลาเข้ากะ ≥ OT ขั้นต่ำ (นับเมื่อมีเวลาออกแล้ว)
          const [prem, brkPre] = otPart(win.start - ms(a.in_at));
          day.otBreak = brkPost + brkPre; sum.otBreak += day.otBreak;
          day.preOt = prem / 60; day.preOtUnflagged = prem > 0 && !a.pre_ot;
          if (type === 'N') day.ot15 = (otm + prem) / 60; else day.ot3 = (otm + prem) / 60;
          if (ms(a.out_at) < win.end) {
            day.early = Math.ceil((win.end - ms(a.out_at)) / 60e3);
            // ชม.ที่ออกก่อน ปัดขึ้นทีละ 30 นาที แยกตามเหตุผล
            day.earlyH = Math.ceil(day.early / 30) * 30 / 60;
            day.earlyReason = a.early_reason || '';
            if (a.early_reason === 'SL') day.slH = day.earlyH;
            else if (a.early_reason === 'PL') day.plH = day.earlyH;
            else if (a.early_reason === 'BOSS') day.bossH = day.earlyH;
            sum.earlyCount++; sum.earlyH += day.earlyH; sum.slH += day.slH || 0; sum.plH += day.plH || 0; sum.bossH += day.bossH || 0;
          }
          sum.preOt += day.preOt;
          if (type === 'H') day.ot1 = hHours;
          if (type === 'PH') day.ot2 = hHours;
        } else if (now > win.end + missH * 3600e3) {
          day.kind = 'missing'; sum.missing++;
        } else {
          day.kind = 'working';
        }
        day.fee = +sh.fee || 0;
        day.worked = type === 'N' ? 1 : 0;
        if (type !== 'N') sum.holidayWork++;
        day.extra = +emp.extra_allowance || 0;
      } else if (beforeStart) {
        day.kind = 'pre';
      } else if (resigned) {
        day.code = 'R'; day.kind = 'R';
      } else if (req) {
        day.code = req.code; day.kind = req.code; sum[req.code]++;
      } else if (hol) {
        day.code = 'PH'; day.kind = 'PH';
      } else if (s.go_live && date < s.go_live) {
        day.kind = 'none';
      } else if (date < today) {
        day.code = 'AB'; day.kind = 'AB'; sum.AB++;
      } else {
        day.kind = date === today ? 'pending' : 'future';
      }
      if (hol && !beforeStart && !resigned) { day.ph = true; sum.phDays++; }
      sum.worked += day.worked; sum.ot1 += day.ot1; sum.ot15 += day.ot15; sum.ot2 += day.ot2; sum.ot3 += day.ot3;
      sum.fee += day.fee; sum.extra += day.extra;
      days.push(day);
    }
    const r2 = (n) => Math.round(n * 100) / 100;
    sum.wage = r2(sum.worked * (+rates.day || 0));
    sum.otMoney = r2(sum.ot1 * (+rates.ot1 || 0) + sum.ot15 * (+rates.ot15 || 0) + sum.ot2 * (+rates.ot2 || 0) + sum.ot3 * (+rates.ot3 || 0));
    sum.fee = r2(sum.fee); sum.extra = r2(sum.extra);
    sum.phMoney = r2(sum.phDays * (+rates.ph || 0));
    // เบี้ยขยัน: อยู่ครบทั้งรอบ + ไม่สาย ไม่ขาด (AB) ไม่ลา (PL/SL/WOP) · วันหยุด H/PH ไม่ตัดสิทธิ์
    const fullCycle = (!emp.start_date || emp.start_date <= o.from) && !(emp.status === 'Resign' && emp.resign_date && emp.resign_date <= o.to);
    const reasons = [];
    if (!fullCycle) reasons.push('ไม่ครบรอบ');
    if (sum.late) reasons.push('สาย ' + sum.late);
    if (sum.AB) reasons.push('ขาด ' + sum.AB);
    if (sum.PL + sum.SL + sum.WOP) reasons.push('ลา ' + (sum.PL + sum.SL + sum.WOP));
    if (sum.slH + sum.plH) reasons.push('ลาระหว่างวัน ' + (sum.slH + sum.plH) + ' ชม.');
    if (!sum.worked && !sum.holidayWork) reasons.push('ไม่มีวันทำงาน');
    sum.diligenceOk = reasons.length === 0;
    sum.diligenceNote = reasons.join(', ');
    sum.diligence = sum.diligenceOk ? r2(+(rates.diligence ?? 400) || 0) : 0;
    sum.total = r2(sum.wage + sum.otMoney + sum.fee + sum.extra + sum.phMoney + sum.diligence);
    return { days, sum };
  }

  const fmtMoney = (n) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtH = (n) => (n ? String(Math.round(n * 100) / 100) : '0');

  return { BKK, pad, bkkParts, bkkDate, bkkTime, addDays, dow, at, cycleOf, shiftCycle, shiftWindow, computeEmployee, fmtMoney, fmtH };
})();

</script>

    const t0 = Date.now();
    const { data, error } = await sb.rpc('server_now');
    if (error) throw error;
    const t1 = Date.now();
    S.offset = new Date(data).getTime() - (t0 + t1) / 2;

async function doLogin() {
  const emp = $('emp').value.trim(), pin = $('pin').value.trim();
  if (emp.includes('@')) {
    setBusy(true);
    try {
      const r = await sb.auth.signInWithPassword({ email: emp, password: $('pin').value });
      if (r.error) throw r.error;
      if (!(await isAdminSession())) { await sb.auth.signOut(); throw new Error('NOT_ADMIN'); }
      store.set('aa_last_emp', emp.toLowerCase());
      setBusy(false);
      return window.ADM.start();
    } catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
    return;
  }
  if (!/^\d{6}$/.test(pin)) return toast(L().errors.PIN_FORMAT, true);
  setBusy(true);
  try {
    const { data: email, error } = await sb.rpc('login_email', { p_emp: emp });
    if (error) throw error;
    const r = await sb.auth.signInWithPassword({ email, password: pin });
    if (r.error) throw r.error;
    store.set('aa_last_emp', emp.toUpperCase());
    await afterLogin();
  } catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
}
async function doActivate() {
  const emp = $('aemp').value.trim(), code = $('acode').value.trim(), p1 = $('apin1').value.trim(), p2 = $('apin2').value.trim();
  if (!/^\d{6}$/.test(p1)) return toast(L().errors.PIN_FORMAT, true);
  if (p1 !== p2) return toast(L().errors.PIN_MATCH, true);
  setBusy(true);
  try {
    const { data: email, error } = await sb.rpc('activation_check', { p_emp: emp, p_code: code });
    if (error) throw error;
    if (!email) throw new Error('BAD_CODE');
    let r = await sb.auth.signUp({ email, password: p1 });
    if (r.error && /already registered|already exists/i.test(r.error.message)) {
      r = await sb.auth.signInWithPassword({ email, password: p1 });
    }
    if (r.error) throw r.error;
    if (!r.data.session) throw new Error('CONFIRM_ON');
    const l = await sb.rpc('activate_link', { p_emp: emp, p_code: code });
    if (l.error) throw l.error;
    store.set('aa_last_emp', emp.toUpperCase());
    await afterLogin();
  } catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
}
async function afterLogin() {
  setMode('emp');
  try {
    const uid = (await sb.auth.getUser()).data.user?.id;
    const [me, st, sh, ho] = await Promise.all([
      sb.from('employees').select('*').eq('user_id', uid).maybeSingle(),
      sb.from('settings').select('data').eq('id', 1).single(),
      sb.from('shifts').select('*').order('sort'),
      sb.from('holidays').select('*')
    ]);
    if (me.error) throw me.error;
    if (!me.data || me.data.status !== 'Active') { await sb.auth.signOut(); throw new Error('NOT_EMPLOYEE'); }
    S.me = me.data; S.settings = st.data ? st.data.data : {};

    S.holidays = {}; for (const h of (ho.data || [])) S.holidays[h.hdate] = h.name;
    S.view = 'app'; S.tab = 'time'; S.anim = 'enter';

}

let gpsWatch = null;
function startGps() {

    const site = (S.settings && S.settings.site) || {};
    const lat = p.coords.latitude, lng = p.coords.longitude, acc = p.coords.accuracy;
    const maxAcc = +(S.settings.max_accuracy || 50), radius = +(site.radius || 200);
    let dist = null, state = 'nosite';
    if (site.lat != null && site.lng != null) {
      dist = distM(+site.lat, +site.lng, lat, lng);
      state = acc > maxAcc ? 'weak' : dist <= radius ? 'in' : 'out';

  const lines = [];

  if (l1) lines.push(l1);
  const l2 = [on('site') ? i.site : '', on('address') ? i.address : ''].filter(Boolean).join(' ');
  if (l2) lines.push(l2);
  const l3 = [on('coords') ? i.coords : '', on('distance') ? i.dist : ''].filter(Boolean).join(' · ');
  if (l3) lines.push(l3);
  lines.push('CJ WFDC · Agency Attendance · ภาพถ่ายจริงจากกล้อง');
  const fam = "'IBM Plex Sans Thai', sans-serif";

  x.fillStyle = 'rgba(0,0,0,0.5)'; x.fillRect(0, H - boxH, W, boxH);
  let y = H - boxH + pad;
  x.fillStyle = '#fff'; x.textBaseline = 'top';
  let cx = pad;
  if (on('time')) { x.font = `700 58px ${fam}`; x.fillText(i.time, cx, y - 4); cx += x.measureText(i.time).width + 16; x.fillStyle = '#F5B700'; x.fillRect(cx, y + 2, 5, 54); cx += 20; x.fillStyle = '#fff'; }
  x.font = `600 22px ${fam}`;
  if (on('date')) x.fillText(i.date, cx, y + 2);
  x.font = `400 21px ${fam}`;
  const kindTxt = [on('day') ? i.day : '', on('kind') ? (i.kind === 'IN' ? 'IN · เข้างาน' : 'OUT · ออกงาน') : '', on('shift') && i.shift ? 'กะ ' + i.shift : ''].filter(Boolean).join(' · ');
  x.fillText(kindTxt, cx, y + 31);

}
function toBlob(cv, q) { return new Promise((r) => cv.toBlob(r, 'image/jpeg', q)); }
async function compress(cv) {

}

/* ===== Motion: skeleton · แถบโหลด · การ์ดเลื่อนขึ้น · ตัวเลขวิ่ง ===== */
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function skel(kind) {
  const line = (w, h, extra) => `<div class="sk" style="width:${w};height:${h}px;${extra || ''}"></div>`;
  const kpi = `<div class="kpi">${line('55%', 12)}${line('35%', 28, 'margin-top:8px')}</div>`;
  const row = `<div class="row" style="padding:12px 0;border-bottom:1px solid #EEF1F4">${line('34px', 34, 'border-radius:50%;flex:none')}<div class="col" style="flex:1;gap:6px">${line('40%', 13)}${line('22%', 10)}</div>${line('72px', 22, 'border-radius:12px')}</div>`;
  const rows = (n) => `<section class="card" style="padding:4px 20px">${row.repeat(n)}</section>`;
  if (kind === 'rows') return `<div style="padding:4px 20px">${row.repeat(6)}</div>`;
  if (kind === 'ts') return `<div class="kpis" style="margin-bottom:16px">${kpi.repeat(7)}</div><section class="card" style="padding:12px 20px">${(`<div class="row" style="gap:6px;padding:8px 0">${line('180px', 14, 'flex:none')}${line('100%', 22, 'flex:1').repeat(10)}</div>`).repeat(6)}</section>`;
  return `<div class="col" style="gap:16px">${line('240px', 26)}<div class="kpis">${kpi.repeat(4)}</div>${rows(5)}</div>`;
}
function topLoad(on) {
  let b = document.getElementById('topload');
  if (!b) { b = document.createElement('div'); b.id = 'topload'; b.className = 'topload'; document.body.appendChild(b); }
  if (on) { b.style.width = ''; b.className = 'topload'; void b.offsetWidth; b.className = 'topload run'; return; }
  const w = getComputedStyle(b).width; b.className = 'topload'; b.style.width = w; void b.offsetWidth; b.className = 'topload done';
  setTimeout(() => { if (b.className === 'topload done') { b.className = 'topload'; b.style.width = ''; } }, 650);
}
function countUp(root) {
  if (!root || reduceMotion()) return;
  root.querySelectorAll('.kpi b, .otc b.num').forEach((el) => {
    const node = [...el.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim());
    if (!node) return;
    const raw = node.textContent.trim();
    if (!/^-?[\d,]+(\.\d+)?$/.test(raw)) return;
    const end = +raw.replace(/,/g, ''); if (!end) return;
    const dec = (raw.split('.')[1] || '').length, comma = raw.includes(',') || dec === 2;
    const fmt = (v) => comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : (dec ? v.toFixed(dec) : String(Math.round(v)));
    const tail = node.textContent.endsWith(' ') ? ' ' : '';
    const t0 = performance.now(), dur = 750;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); node.textContent = fmt(end * (1 - Math.pow(1 - k, 3))) + tail; if (k < 1 && node.isConnected) requestAnimationFrame(step); };
    node.textContent = fmt(0) + tail; requestAnimationFrame(step);
  });
}
function animIn(root, rowsOnly) {
  if (!root || reduceMotion()) return;
  const set = new Set();
  if (!rowsOnly) [...root.children].forEach((e) => set.add(e));
  root.querySelectorAll('.kpis > *, .otc').forEach((e) => set.add(e));
  [...root.querySelectorAll('tbody > tr')].slice(0, 14).forEach((e) => set.add(e));
  let i = 0;
  for (const el of set) { el.style.animation = `up .45s cubic-bezier(.2,.8,.2,1) ${Math.min(i++, 14) * 0.04}s both`; }
  countUp(root);
}

/* ===== Data helpers ===== */
async function fetchRange(from, to) {
  const [a, r] = await Promise.all([
    sb.from('attendance').select('*').gte('work_date', from).lte('work_date', to).order('in_at').limit(5000),
    sb.from('requests').select('*').lte('date_from', to).gte('date_to', from).limit(5000)
  ]);
  if (a.error) throw a.error; if (r.error) throw r.error;
  return { att: a.data || [], reqs: r.data || [] };
}
function empsInRange(from, to, data) {
  // คนลาออก: แสดงเฉพาะเมื่อมีบันทึกเข้า-ออก หรือใบลา (active) อย่างน้อย 1 รายการในรอบ
  const has = new Set();
  if (data) {
    (data.att || []).forEach((x) => has.add(x.emp_id));
    (data.reqs || []).forEach((x) => { if (x.status === 'active') has.add(x.emp_id); });
  }
  return A.emps.filter((e) => (!e.start_date || e.start_date <= to) &&
      (e.status === 'Active' || (!e.resign_date || e.resign_date > from) && (!data || has.has(e.emp_id))))
    .filter((e) => !A.agencyFilter || e.agency === A.agencyFilter);
}
function computeAll(from, to, data) {
  return empsInRange(from, to, data).map((emp) => ({ emp, ...Calc.computeEmployee({ emp, from, to, attendance: data.att, requests: data.reqs, holidays: A.holidays, shifts: A.shifts, settings: A.settings, now: nowMs() }) }));
}
function codeClass(d) {
  if (!d) return 'c-none';
  if (d.kind === 'missing') return 'c-miss';
  if (d.kind === 'work' || d.kind === 'working') return d.late ? 'c-late' : d.code === 'N' ? 'c-n' : d.code === 'A' ? 'c-a' : 'c-work';
  if (d.kind === 'holiday') return 'c-hol';
  if (['PL', 'SL', 'WOP'].includes(d.kind)) return 'c-leave';
  if (d.kind === 'AB') return 'c-ab';
  if (['H', 'PH', 'R'].includes(d.kind)) return 'c-off';
  return 'c-none';
}
const EARLY = { SL: 'ป่วย (SL)', PL: 'ธุระ (PL)', BOSS: 'หัวหน้าให้กลับ' };
const earlyTxt = (a) => a && a.early_reason ? EARLY[a.early_reason] + (a.early_boss ? ' · ' + a.early_boss : '') + (a.early_note ? ' · ' + a.early_note : '') : '';

function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
async function doImport() {
  let text = $('csvt').value;
  const f = $('csvf').files[0]; if (f) text = await f.text();
  text = text.replace(/^﻿/, '');
  const rows = parseCsv(text); if (rows.length < 2) return toast('ไม่พบข้อมูล', true);
  const head = rows[0].map((h) => h.trim());
  const allowed = ['emp_id', 'title_th', 'first_th', 'last_th', 'title_en', 'first_en', 'last_en', 'agency', 'dept', 'position', 'area', 'worker', 'hire_type', 'gender', 'start_date', 'end_date', 'status', 'resign_date', 'extra_allowance', 'extra_note'];
  const out = [];
  for (const r of rows.slice(1)) {
    const o = {}; head.forEach((h, i) => { if (allowed.includes(h)) o[h] = (r[i] || '').trim() || null; });
    if (!o.emp_id) continue;
    o.emp_id = o.emp_id.toUpperCase().replace(/\s/g, '');
    o.display_name = `${o.title_th || ''}${o.first_th || ''} ${o.last_th || ''}`.trim();
    o.status = o.status === 'Resign' ? 'Resign' : 'Active';
    o.extra_allowance = +o.extra_allowance || 0;
    out.push(o);
  }
  const ags = [...new Set(out.map((o) => o.agency).filter(Boolean))].filter((a) => !A.agencies.some((x) => x.name === a));
  if (ags.length) { const r = await sb.from('agencies').upsert(ags.map((name) => ({ name }))); if (r.error) return toast(errMsg(r.error), true); }
  const { error } = await sb.from('employees').upsert(out, { onConflict: 'emp_id' });
  if (error) return toast(errMsg(error), true);
  closeModal(); toast(`นำเข้า ${out.length} คน`); go('emp');
}

async function cleanup(manual) {

  const paths = (data || []).map((x) => (typeof x === 'string' ? x : x.admin_old_photos));
  let removed = 0;

  }
