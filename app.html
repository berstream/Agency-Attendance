<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#0F1E2E; --ink2:#33475B; --muted:#5B6B7B; --faint:#8795A3;
  --line:#E2E7EC; --line2:#D5DCE3; --navy:#13324F; --navy2:#1F4A70;
  --green:#0B8457; --green-ink:#0B6E4A; --green-soft:#E3F4EC;
  --orange:#B54708; --orange-soft:#FEF0E1; --red:#C0262D; --red-soft:#FDE8E8;
  --amber-ink:#7A4A00; --amber-soft:#FFF1D6; --blue-soft:#CFE0F5; --blue-ink:#1E3A5F; --gray-soft:#E2E7EC;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','Noto Sans Myanmar',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--green-ink)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{display:none}
.main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px 96px;display:flex;flex-direction:column;gap:14px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.bottomnav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
.bottomnav button.on{color:var(--green-ink);font-weight:600}
@media (min-width:900px){
  .topbar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:0 32px;min-height:64px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .topbar nav{display:flex;gap:4px;flex:1}
  .topbar nav button{height:38px;padding:0 16px;border-radius:9px;border:none;background:none;color:#C9D6E2;font-size:14px}
  .topbar nav button.on{background:var(--navy2);color:#fff;font-weight:600}
  .bottomnav{display:none}
  .main{max-width:1200px;padding:24px 32px 40px}
  .main.narrow{max-width:620px}
}

/* ---------- atoms ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.h1{font-size:22px;font-weight:700;margin:0}
.lbl{font-size:12px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green-ink)}
.chip.bad{background:var(--red-soft);color:#A3161D}
.chip.warn{background:var(--orange-soft);color:var(--orange)}
.chip.info{background:#E8F0FA;color:var(--blue-ink)}
.chip.gray{background:#EEF1F4;color:var(--ink2)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.btn{height:52px;border-radius:14px;border:none;padding:0 18px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.big{height:64px;border-radius:18px;font-size:19px}
.btn.primary{background:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line2);color:var(--ink2)}
.btn:disabled{opacity:.45}
.btn.ghost:disabled{opacity:1;color:var(--faint)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);padding:0 14px;font-size:17px;width:100%}
.input:focus{outline:none;border-color:var(--green)}
textarea.input{height:auto;min-height:72px;padding:10px 14px;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--gray-soft);border-radius:12px;padding:3px}
.seg button{height:36px;border:none;border-radius:10px;background:none;color:var(--ink2);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
.pillbtn{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;color:var(--navy)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;display:inline-flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99;max-width:92vw;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--red)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.spinner.dark{border-color:rgba(19,50,79,.2);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.lang{display:flex;gap:6px}
.lang button{height:34px;padding:0 12px;border-radius:17px;border:1px solid #4A6681;background:transparent;color:#fff;font-size:13px}
.lang button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.lang.light button{border-color:var(--line2);color:var(--ink2)}
.lang.light button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- login ---------- */
.auth{min-height:100%;background:var(--navy);display:flex;flex-direction:column;align-items:center}
.auth-in{width:100%;max-width:460px;flex:1;display:flex;flex-direction:column}
.auth-head{padding:24px 26px 30px;color:#fff;display:flex;flex-direction:column;gap:12px}
.auth-body{flex:1;background:var(--bg);border-radius:28px 28px 0 0;padding:26px 22px 30px;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.auth{justify-content:center}.auth-in{flex:none}.auth-body{border-radius:28px}}
.logo{width:54px;height:54px;border-radius:16px;background:var(--green);display:flex;align-items:center;justify-content:center}

/* ---------- home ---------- */
.clock{font-size:56px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.geo{display:flex;align-items:center;gap:16px}
@media (min-width:900px){
  .home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
}

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;z-index:40;background:#0B141D;color:#fff;display:flex;flex-direction:column;padding:14px 16px calc(20px + env(safe-area-inset-bottom));gap:12px;overflow:auto}
.cam-in{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1}
.shiftbtn{height:58px;border-radius:14px;border:1.5px solid #33475B;background:#15212D;color:#D5DEE6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.shiftbtn.on{border:2px solid #2BC48A;background:#12402F;color:#fff}
.shiftbtn small{font-size:11px;color:#9BE8C6;font-weight:500}
.viewer{position:relative;flex:1;min-height:300px;border-radius:22px;overflow:hidden;background:#26394A}
.viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.viewer .oval{position:absolute;left:50%;top:44%;width:58%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.8);border-radius:50%}
.viewer .badge{position:absolute;top:12px;left:12px}
.wm{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.55);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.wm .t{font-size:32px;font-weight:700;line-height:1}
.wm .bar{width:3px;height:30px;background:#F5B700;border-radius:2px}
.blocked{position:absolute;inset:0;background:#1A2530;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.shutter{width:82px;height:82px;border-radius:41px;border:4px solid #2BC48A;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.shutter span{width:64px;height:64px;border-radius:32px;background:#fff;display:block}
.shutter:disabled{border-color:#33475B}
.shutter:disabled span{background:#33475B}

/* ---------- my time ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{height:52px;border-radius:9px;padding:3px 1px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#fff;color:var(--faint);font-size:11px;line-height:1.05}
.cell .d{font-weight:600}
.cell .c{font-size:10px;font-weight:700}
.cell .t{font-size:9px}
.cell .range,.cell .pill{display:none}
.cell.sel{box-shadow:0 0 0 2px var(--navy)}
.k-work{background:var(--blue-soft);color:var(--blue-ink)}
.k-late{background:var(--orange-soft);color:#8A3505}
.k-missing{background:var(--red-soft);color:#A3161D;border-color:var(--red)}
.k-holiday{background:var(--amber-soft);color:var(--amber-ink)}
.k-off{background:var(--gray-soft);color:var(--ink2)}
.k-leave{background:#F1E8FA;color:#5B2A86}
.k-ab{background:var(--red);color:#fff}
.k-today,.k-working{background:var(--green-soft);color:#0B4F36;border:2px solid var(--green)}
.k-future{background:#fff;border:1px dashed #C5CED7}
.k-out{background:transparent;color:#C5CED7}
.k-ab .pill,.k-ab .c{background:rgba(255,255,255,.22)!important;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dayrow{background:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.code{min-width:46px;height:28px;padding:0 6px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.photo-thumb{height:84px;border-radius:10px;background:#4C6478;object-fit:cover;width:100%}
.photo-none{height:84px;border-radius:10px;border:1.5px dashed #C5CED7;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}
@media (min-width:900px){
  .mt-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .cal{gap:6px}
  .cell{height:auto;min-height:104px;align-items:flex-start;justify-content:flex-start;gap:5px;padding:8px;font-size:14px;border-radius:12px;text-align:left}
  .cell .top{display:flex;justify-content:space-between;width:100%}
  .cell .c{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.7)}
  .cell .t{display:none}
  .cell .range{display:block;font-size:13px;font-weight:600}
  .cell .pill{display:block;align-self:stretch;font-size:11px;font-weight:600;padding:3px 6px;border-radius:6px;background:#fff}
  .cal .wd{font-size:13px;font-weight:600}
}
@media (max-width:899px){.cell .top{display:contents}}
</style>

<body>

<script>
/* ===== Config ===== */
const SUPABASE_URL = 'https://ttemsbwugnqydxfgwudf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dug1Z0767MzSN7AaYvwllQ_-M_s2Yrr';
const APP_VERSION = '1.0.0';

/* ===== Calc engine (shared: app.html + admin.html) — คิดรหัสรายวัน / OT / เงิน ===== */
const Calc = (() => {
  const BKK = 7 * 3600e3;
  const DAY = 864e5;
  const pad = (n) => String(n).padStart(2, '0');
  const ms = (t) => (t == null ? null : typeof t === 'number' ? t : new Date(t).getTime());

  function bkkParts(t) {
    const d = new Date(ms(t) + BKK);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mi: d.getUTCMinutes(), ss: d.getUTCSeconds(), dow: d.getUTCDay() };
  }
  const bkkDate = (t) => { const p = bkkParts(t); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; };
  const bkkTime = (t) => { if (t == null) return ''; const p = bkkParts(t); return `${pad(p.hh)}:${pad(p.mi)}`; };
  const parseD = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const addDays = (s, n) => new Date(parseD(s) + n * DAY).toISOString().slice(0, 10);
  const dow = (s) => new Date(parseD(s)).getUTCDay();
  const at = (dateStr, hhmm) => parseD(dateStr) + (+hhmm.slice(0, 2)) * 3600e3 + (+hhmm.slice(3, 5)) * 60e3 - BKK;

  function cycleOf(dateStr, startDay) {
    startDay = startDay || 26;
    let y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7);
    const d = +dateStr.slice(8, 10);
    if (d < startDay) { m -= 1; if (m < 1) { m = 12; y -= 1; } }
    const from = `${y}-${pad(m)}-${pad(startDay)}`;
    let y2 = y, m2 = m + 1; if (m2 > 12) { m2 = 1; y2 += 1; }
    const to = addDays(`${y2}-${pad(m2)}-${pad(startDay)}`, -1);
    return { from, to };
  }
  const shiftCycle = (cyc, n, startDay) => cycleOf(addDays(n < 0 ? cyc.from : cyc.to, n < 0 ? -1 : 1), startDay);

  function shiftWindow(sh, workDate) {
    const start = at(workDate, sh.start_time);
    let end = at(workDate, sh.end_time);
    if (end <= start) end += DAY;
    return { start, end };
  }

  /* ใบลาที่ครอบคลุมวันนั้น (active, ล่าสุดก่อน) */
  function reqOn(requests, date) {
    let best = null;
    for (const r of requests) {
      if (r.status !== 'active' || date < r.date_from || date > r.date_to) continue;
      if (!best || r.created_at > best.created_at) best = r;
    }
    return best;
  }

  /**
   * คิดทั้งรอบของพนักงาน 1 คน
   * opts: {emp, from, to, attendance[], requests[], holidays{date:name}, shifts{code:row}, settings, now}
   */
  function computeEmployee(o) {
    const s = o.settings || {};
    const grace = +(s.grace_minutes ?? 5);
    const otMin = +(s.ot_min_minutes ?? 30);
    const otStep = Math.max(1, +(s.ot_step_minutes ?? 30));
    const missH = +(s.missing_after_hours ?? 4);
    const hHours = +(s.holiday_hours ?? 8);
    const rates = s.rates || {};
    const now = ms(o.now) || Date.now();
    const today = bkkDate(now);
    const emp = o.emp;
    const byDate = {};
    for (const a of o.attendance) if (a.emp_id === emp.emp_id) (byDate[a.work_date] = byDate[a.work_date] || []).push(a);
    const reqs = o.requests.filter((r) => r.emp_id === emp.emp_id);
    const days = [];
    const sum = { worked: 0, ot1: 0, ot15: 0, ot2: 0, ot3: 0, fee: 0, extra: 0, phDays: 0, late: 0, lateMin: 0, missing: 0, AB: 0, H: 0, PL: 0, SL: 0, WOP: 0, holidayWork: 0 };

    for (let date = o.from; date <= o.to; date = addDays(date, 1)) {
      const hol = o.holidays[date] || null;
      const req = reqOn(reqs, date);
      const list = (byDate[date] || []).slice().sort((x, y) => ms(x.in_at) - ms(y.in_at));
      const a = list[0] || null;
      const day = { date, dow: dow(date), code: '', kind: 'none', holiday: hol, request: req, att: a, extraAtt: list.slice(1),
        shift: null, inAt: a ? a.in_at : null, outAt: a ? a.out_at : null,
        late: 0, early: 0, ot1: 0, ot15: 0, ot2: 0, ot3: 0, fee: 0, worked: 0, extra: 0, ph: false, notes: [] };
      const beforeStart = emp.start_date && date < emp.start_date;
      const resigned = emp.status === 'Resign' && emp.resign_date && date >= emp.resign_date;

      if (a) {
        const sh = o.shifts[a.shift_code] || { ts_code: a.shift_code, start_time: '08:00', end_time: '17:00', fee: 0 };
        const win = shiftWindow(sh, date);
        const type = hol ? 'PH' : (req && req.code === 'H') ? 'H' : 'N';
        day.shift = a.shift_code;
        day.code = type === 'N' ? sh.ts_code : type + sh.ts_code + '8';
        day.kind = type === 'N' ? 'work' : 'holiday';
        const lateMin = Math.floor((ms(a.in_at) - win.start) / 60e3);
        if (lateMin > grace) { day.late = lateMin; sum.late++; sum.lateMin += lateMin; day.notes.push('late'); }
        if (a.out_at) {
          const extra = ms(a.out_at) - win.end;
          const otm = extra >= otMin * 60e3 ? Math.floor(extra / (otStep * 60e3)) * otStep : 0;
          if (type === 'N') day.ot15 = otm / 60; else day.ot3 = otm / 60;
          if (ms(a.out_at) < win.end) day.early = Math.ceil((win.end - ms(a.out_at)) / 60e3);
          if (type === 'H') day.ot1 = hHours;
          if (type === 'PH') day.ot2 = hHours;
        } else if (now > win.end + missH * 3600e3) {
          day.kind = 'missing'; sum.missing++;
        } else {
          day.kind = 'working';
        }
        day.fee = +sh.fee || 0;
        day.worked = type === 'N' ? 1 : 0;
        if (type !== 'N') sum.holidayWork++;
        day.extra = +emp.extra_allowance || 0;
      } else if (beforeStart) {
        day.kind = 'pre';
      } else if (resigned) {
        day.code = 'R'; day.kind = 'R';
      } else if (req) {
        day.code = req.code; day.kind = req.code; sum[req.code]++;
      } else if (hol) {
        day.code = 'PH'; day.kind = 'PH';
      } else if (s.go_live && date < s.go_live) {
        day.kind = 'none';
      } else if (date < today) {
        day.code = 'AB'; day.kind = 'AB'; sum.AB++;
      } else {
        day.kind = date === today ? 'pending' : 'future';
      }
      if (hol && !beforeStart && !resigned) { day.ph = true; sum.phDays++; }
      sum.worked += day.worked; sum.ot1 += day.ot1; sum.ot15 += day.ot15; sum.ot2 += day.ot2; sum.ot3 += day.ot3;
      sum.fee += day.fee; sum.extra += day.extra;
      days.push(day);
    }
    const r2 = (n) => Math.round(n * 100) / 100;
    sum.wage = r2(sum.worked * (+rates.day || 0));
    sum.otMoney = r2(sum.ot1 * (+rates.ot1 || 0) + sum.ot15 * (+rates.ot15 || 0) + sum.ot2 * (+rates.ot2 || 0) + sum.ot3 * (+rates.ot3 || 0));
    sum.fee = r2(sum.fee); sum.extra = r2(sum.extra);
    sum.phMoney = r2(sum.phDays * (+rates.ph || 0));
    sum.total = r2(sum.wage + sum.otMoney + sum.fee + sum.extra + sum.phMoney);
    return { days, sum };
  }

  const fmtMoney = (n) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtH = (n) => (n ? String(Math.round(n * 100) / 100) : '0');

  return { BKK, pad, bkkParts, bkkDate, bkkTime, addDays, dow, at, cycleOf, shiftCycle, shiftWindow, computeEmployee, fmtMoney, fmtH };
})();


/* ===== i18n ===== */
const I18N = {
  th: {
    title: 'ลงเวลาเข้า-ออกงาน', sub: 'Agency WFDC', loginSub: 'ใช้รหัสพนักงานและ PIN ของคุณ', empId: 'รหัสพนักงาน', pin: 'PIN 6 หลัก',

}
async function syncTime() {
  try {
    const t0 = Date.now();
    const { data, error } = await sb.rpc('server_now');
    if (error) throw error;
    const t1 = Date.now();
    S.offset = new Date(data).getTime() - (t0 + t1) / 2;
  } catch (e) { /* ใช้เวลาเครื่องชั่วคราว */ }
}
async function doLogin() {
  const emp = $('emp').value.trim(), pin = $('pin').value.trim();
  if (!/^\d{6}$/.test(pin)) return toast(L().errors.PIN_FORMAT, true);
  setBusy(true);
  try {
    const { data: email, error } = await sb.rpc('login_email', { p_emp: emp });
    if (error) throw error;
    const r = await sb.auth.signInWithPassword({ email, password: pin });
    if (r.error) throw r.error;
    store.set('aa_last_emp', emp.toUpperCase());
    await afterLogin();
  } catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
}
async function doActivate() {
  const emp = $('aemp').value.trim(), code = $('acode').value.trim(), p1 = $('apin1').value.trim(), p2 = $('apin2').value.trim();
  if (!/^\d{6}$/.test(p1)) return toast(L().errors.PIN_FORMAT, true);
  if (p1 !== p2) return toast(L().errors.PIN_MATCH, true);
  setBusy(true);
  try {
    const { data: email, error } = await sb.rpc('activation_check', { p_emp: emp, p_code: code });
    if (error) throw error;
    if (!email) throw new Error('BAD_CODE');
    let r = await sb.auth.signUp({ email, password: p1 });
    if (r.error && /already registered|already exists/i.test(r.error.message)) {
      r = await sb.auth.signInWithPassword({ email, password: p1 });
    }
    if (r.error) throw r.error;
    if (!r.data.session) throw new Error('CONFIRM_ON');
    const l = await sb.rpc('activate_link', { p_emp: emp, p_code: code });
    if (l.error) throw l.error;
    store.set('aa_last_emp', emp.toUpperCase());
    await afterLogin();

}

      sb.from('employees').select('*').eq('user_id', uid).maybeSingle(),
      sb.from('settings').select('data').eq('id', 1).single(),
      sb.from('shifts').select('*').order('sort'),
      sb.from('holidays').select('*')

let gpsWatch = null;
function startGps() {
  if (!navigator.geolocation) { S.gps = { state: 'off' }; return; }
  stopGps();
  S.gps = { state: 'wait' };
  gpsWatch = navigator.geolocation.watchPosition((p) => {
    const site = (S.settings && S.settings.site) || {};
    const lat = p.coords.latitude, lng = p.coords.longitude, acc = p.coords.accuracy;
    const maxAcc = +(S.settings.max_accuracy || 50), radius = +(site.radius || 200);
    let dist = null, state = 'nosite';
    if (site.lat != null && site.lng != null) {
      dist = distM(+site.lat, +site.lng, lat, lng);
      state = acc > maxAcc ? 'weak' : dist <= radius ? 'in' : 'out';
    }
    S.gps = { state, lat, lng, acc, dist, radius, maxAcc };
    updateGpsUi();
  }, (err) => { S.gps = { state: 'off', err: err.message }; updateGpsUi(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

/* วาดรูป + watermark ลงภาพจริง แล้วบีบไฟล์ ~100KB */
async function capture() {
  const v = $('video');
  const W = 720, H = Math.round(W * (v.videoHeight / v.videoWidth || 4 / 3));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.drawImage(v, 0, 0, W, H);
  await document.fonts.ready;
  const i = wmInfo(), wmc = (S.settings && S.settings.watermark) || {};
  const on = (k) => wmc[k] !== false;
  const lines = [];
  const l1 = [on('name') ? i.name : '', on('emp_id') ? i.emp : '', on('agency') ? i.agency : ''].filter(Boolean).join(' · ');
  if (l1) lines.push(l1);
  const l2 = [on('site') ? i.site : '', on('address') ? i.address : ''].filter(Boolean).join(' ');
  if (l2) lines.push(l2);
  const l3 = [on('coords') ? i.coords : '', on('distance') ? i.dist : ''].filter(Boolean).join(' · ');
  if (l3) lines.push(l3);
  lines.push('CJ WFDC · Agency Attendance · ภาพถ่ายจริงจากกล้อง');
  const fam = "'IBM Plex Sans Thai', sans-serif";
  const pad = 22, lh = 26, top = 70;
  const boxH = pad + top + lines.length * lh + pad - 6;
  x.fillStyle = 'rgba(0,0,0,0.5)'; x.fillRect(0, H - boxH, W, boxH);
  let y = H - boxH + pad;
  x.fillStyle = '#fff'; x.textBaseline = 'top';
  let cx = pad;
  if (on('time')) { x.font = `700 58px ${fam}`; x.fillText(i.time, cx, y - 4); cx += x.measureText(i.time).width + 16; x.fillStyle = '#F5B700'; x.fillRect(cx, y + 2, 5, 54); cx += 20; x.fillStyle = '#fff'; }
  x.font = `600 22px ${fam}`;
  if (on('date')) x.fillText(i.date, cx, y + 2);
  x.font = `400 21px ${fam}`;
  const kindTxt = [on('day') ? i.day : '', on('kind') ? (i.kind === 'IN' ? 'IN · เข้างาน' : 'OUT · ออกงาน') : '', on('shift') && i.shift ? 'กะ ' + i.shift : ''].filter(Boolean).join(' · ');
  x.fillText(kindTxt, cx, y + 31);
  y += top;
  x.font = `400 19px ${fam}`; x.fillStyle = '#EEF2F5';
  lines.forEach((ln, k) => { if (k === lines.length - 1) { x.font = `400 15px ${fam}`; x.fillStyle = '#C9D6E2'; } x.fillText(ln, pad, y + k * lh, W - pad * 2); });
  return await compress(cv);
}
function toBlob(cv, q) { return new Promise((r) => cv.toBlob(r, 'image/jpeg', q)); }
async function compress(cv) {
  let q = 0.82, blob = await toBlob(cv, q);
  while (blob.size > 110 * 1024 && q > 0.42) { q -= 0.08; blob = await toBlob(cv, q); }
  let c2 = cv;
  while (blob.size > 110 * 1024 && c2.width > 360) {
    const n = document.createElement('canvas'); n.width = Math.round(c2.width * 0.85); n.height = Math.round(c2.height * 0.85);
    n.getContext('2d').drawImage(c2, 0, 0, n.width, n.height); c2 = n; blob = await toBlob(c2, 0.7);
  }
  return blob;
}
async function shoot() {

  if (!S.leaveFrom) { S.leaveFrom = d; S.leaveTo = d; }
  return `<h1 class="h1">${esc(t('leaveTitle'))}</h1>
    <div class="grid2">${codes.map((c) => `<button data-a="leaveCode" data-v="${c}" style="height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;${S.leaveCode === c ? 'border:2px solid var(--green);background:var(--green-soft);color:#0B4F36' : 'border:1.5px solid var(--line2);background:#fff;color:var(--ink2)'}"><span style="font-size:13px;font-weight:700;letter-spacing:.03em">${c}</span><span style="font-size:15px;font-weight:600">${esc(t(c))}</span></button>`).join('')}</div>
    <div class="grid2"><div class="field"><label for="lf">${esc(t('from'))}</label><input class="input" type="date" id="lf" value="${S.leaveFrom}" min="${Calc.addDays(d, -7)}" style="font-size:15px"></div>
      <div class="field"><label for="lt">${esc(t('to'))}</label><input class="input" type="date" id="lt" value="${S.leaveTo}" min="${Calc.addDays(d, -7)}" style="font-size:15px"></div></div>
    <div class="field"><label for="ln">${esc(t('note'))}</label><input class="input" id="ln" value="${esc(S.leaveNote)}" style="font-size:15px"></div>
    ${S.leaveCode === 'SL' ? `<label class="btn ghost" style="border-style:dashed;font-size:15px;font-weight:500">${ICON.clip}${esc(S.leaveFile ? t('attached') + ' ✓ ' + S.leaveFile.name : t('attach'))}<input type="file" accept="image/*" id="lfile" class="hidden"></label>` : ''}
    <div style="background:#E8F0FA;border-radius:12px;padding:10px 12px;font-size:13px;color:#1E3A5F;line-height:1.5">${esc(t('leaveInfo'))}</div>
    <button class="btn primary" data-a="sendLeave" data-busy data-label="${esc(t('send') + ' ' + t(S.leaveCode))}">${esc(t('send') + ' ' + t(S.leaveCode))}</button>
    <div class="col" style="gap:8px"><div style="font-size:14px;font-weight:600;color:var(--ink2)">${esc(t('recent'))}</div><div id="myReqs" class="col" style="gap:8px">${reqList()}</div></div>`;
}
function reqList() {
  if (!S.myReqs.length) return `<div class="sub">${esc(t('noItems'))}</div>`;
  const d = todayStr();
  return S.myReqs.map((r) => `<div class="dayrow"><span class="code" style="background:#EEF1F4;color:var(--ink2)">${esc(r.code)}</span>
    <div class="col" style="flex:1;min-width:0"><span style="font-size:15px;font-weight:600">${esc(t(r.code))}</span><span class="sub">${esc(fmtDate(r.date_from))}${r.date_to !== r.date_from ? ' – ' + esc(fmtDate(r.date_to)) : ''}${r.note ? ' · ' + esc(r.note) : ''}</span></div>
    <div class="col" style="align-items:flex-end;gap:4px">${r.status === 'cancelled' ? `<span class="chip gray">${esc(t('cancelled'))}</span>` : `<span class="chip ok">${esc(t('effective'))}</span>`}${r.late_notice ? `<span class="chip warn">${esc(t('lateNotice'))}</span>` : ''}
    ${r.status === 'active' && r.date_from > d ? `<button class="pillbtn" style="height:30px;color:var(--red)" data-a="cancelReq" data-v="${r.id}">${esc(t('cancel'))}</button>` : ''}</div></div>`).join('');
}
async function loadMyReqs() {
  const { data } = await sb.from('requests').select('*').eq('emp_id', S.me.emp_id).order('created_at', { ascending: false }).limit(20);
  S.myReqs = data || []; const el = $('myReqs'); if (el) el.innerHTML = reqList();
}
async function sendLeave() {
  const from = $('lf').value, to = $('lt').value || from, note = $('ln').value;
  S.leaveFrom = from; S.leaveTo = to; S.leaveNote = note;
  setBusy(true);
  try {
    let attach = null;
    if (S.leaveCode === 'SL' && S.leaveFile) {
      const img = await loadImg(S.leaveFile);
      const cv = document.createElement('canvas'); const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let q = 0.8, blob = await toBlob(cv, q); while (blob.size > 300 * 1024 && q > 0.4) { q -= 0.1; blob = await toBlob(cv, q); }
      attach = `${S.me.emp_id}/docs/${from}_SL_${Date.now()}.jpg`;
      const up = await sb.storage.from('photos').upload(attach, blob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
    }
    const { error } = await sb.rpc('create_request', { p_code: S.leaveCode, p_from: from, p_to: to, p_note: note, p_attach: attach });
    if (error) throw error;
    S.leaveNote = ''; S.leaveFile = null; toast(t('sentOk'));
    render();
  } catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
}
function loadImg(file) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
async function cancelReq(id) {
  if (!confirm(t('confirmCancel'))) return;
  const { error } = await sb.rpc('cancel_request', { p_id: +id });
  if (error) return toast(errMsg(error), true);
  loadMyReqs();
}

/* ----- My time ----- */
function kindClass(d) {
  if (d.date === todayStr() && (d.kind === 'pending' || d.kind === 'working' || d.kind === 'future')) return 'k-today';
  if (d.kind === 'work') return d.late ? 'k-late' : 'k-work';
  return { holiday: 'k-holiday', missing: 'k-missing', working: 'k-working', H: 'k-off', PH: 'k-off', PL: 'k-leave', SL: 'k-leave', WOP: 'k-leave', AB: 'k-ab', R: 'k-off', future: 'k-future', pending: 'k-future', pre: 'k-out', none: 'k-future' }[d.kind] || 'k-future';
}
function dayLabel(d) {
  if (d.kind === 'PH') return d.holiday || t('PH');
  if (['H', 'PL', 'SL', 'WOP', 'AB', 'R'].includes(d.kind)) return t(d.kind);
  if (d.kind === 'pending') return t('today');
  return t('noRecord');
}
function dayPill(d) {
  if (d.kind === 'missing') return t('missing');
  if (d.kind === 'working') return t('working');
  if (d.late) return t('lateMin', { n: d.late });
  if (d.ot1) return t('otLine', { r: 1, h: d.ot1 });
  if (d.ot2) return (d.holiday ? d.holiday + ' · ' : '') + t('otLine', { r: 2, h: d.ot2 });
  if (d.ot15) return t('otLine', { r: 1.5, h: d.ot15 });
  if (d.kind === 'PH') return d.holiday;
  if (['H', 'PL', 'SL', 'WOP', 'AB'].includes(d.kind)) return t(d.kind);
  return '';
}
async function loadMyTime(force) {
  const sd = +(S.settings.cycle_start_day || 26);
  if (!S.cycle) S.cycle = Calc.cycleOf(todayStr(), sd);
  const key = S.cycle.from;
  if (!force && S.mt && S.mt.key === key) { paintMyTime(); return; }
  const [a, r] = await Promise.all([
    sb.from('attendance').select('*').eq('emp_id', S.me.emp_id).gte('work_date', S.cycle.from).lte('work_date', S.cycle.to),
    sb.from('requests').select('*').eq('emp_id', S.me.emp_id).lte('date_from', S.cycle.to).gte('date_to', S.cycle.from)
  ]);
  const res = Calc.computeEmployee({ emp: S.me, from: S.cycle.from, to: S.cycle.to, attendance: a.data || [], requests: r.data || [], holidays: S.holidays, shifts: S.shifts, settings: S.settings, now: nowMs() });
  S.mt = Object.assign({ key }, res);
  if (!S.mtSel || S.mtSel < S.cycle.from || S.mtSel > S.cycle.to) {
    const td = todayStr(); S.mtSel = td >= S.cycle.from && td <= S.cycle.to ? td : S.cycle.to;
  }
  paintMyTime();
}
function viewMyTime() {
  return `<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <h1 class="h1">${esc(t('myTime'))}</h1>
      <div class="row" style="gap:6px"><button class="iconbtn" style="background:#fff;border:1px solid var(--line2);width:38px;height:38px;color:var(--navy)" data-a="cyc" data-v="-1" aria-label="prev">${ICON.back}</button>
        <span class="pillbtn" style="display:inline-flex;align-items:center" id="cycLbl"></span>
        <button class="iconbtn" style="background:#fff;border:1px solid var(--line2);width:38px;height:38px;color:var(--navy)" data-a="cyc" data-v="1" aria-label="next">${ICON.next}</button></div>
    </div>
    <div class="seg" style="max-width:420px"><button data-a="mtView" data-v="list" class="${S.mtView === 'list' ? 'on' : ''}">${esc(t('list'))}</button><button data-a="mtView" data-v="cal" class="${S.mtView === 'cal' ? 'on' : ''}">${esc(t('calendar'))}</button></div>
    <div id="mtBody"><div class="card" style="text-align:center"><span class="spinner dark"></span></div></div>`;
}
function paintMyTime() {
  const body = $('mtBody'); if (!body || !S.mt) return;
  const lbl = $('cycLbl'); if (lbl) lbl.textContent = `${t('cycle')} ${fmtDate(S.cycle.from)} – ${fmtDate(S.cycle.to)}`;
  const s = S.mt.sum;
  const otT = s.ot1 + s.ot15 + s.ot2 + s.ot3;
  const tiles = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
    <div class="card col" style="background:var(--navy);color:#fff;gap:2px"><span style="font-size:13px;color:#C9D6E2">${esc(t('worked'))}</span><span style="font-size:28px;font-weight:700">${s.worked} <span style="font-size:14px;font-weight:500">${esc(t('days'))}</span></span></div>
    <div class="card col" style="gap:2px"><span class="sub">${esc(t('otTotal'))}</span><span style="font-size:28px;font-weight:700">${Calc.fmtH(otT)} <span style="font-size:14px;font-weight:500">${esc(t('hrs'))}</span></span><span class="lbl">1× ${Calc.fmtH(s.ot1)} · 1.5× ${Calc.fmtH(s.ot15)} · 2× ${Calc.fmtH(s.ot2)}${s.ot3 ? ' · 3× ' + Calc.fmtH(s.ot3) : ''}</span></div>
    <div class="card col" style="gap:2px"><span class="sub">${esc(t('late'))}</span><span style="font-size:24px;font-weight:700;color:var(--orange)">${s.late} <span style="font-size:14px;font-weight:500">${esc(t('times'))} · ${s.lateMin} ${esc(t('minutes'))}</span></span></div>
    <div class="card col" style="gap:2px"><span class="sub">${esc(t('offLeave'))}</span><span style="font-size:24px;font-weight:700">${s.H + s.PL + s.SL + s.WOP} <span style="font-size:14px;font-weight:500">${esc(t('days'))}</span></span>${s.missing ? `<span class="lbl" style="color:var(--red)">${esc(t('missing'))} ${s.missing}</span>` : ''}</div></div>`;
  if (S.mtView === 'list') {
    const td = todayStr();
    const rows = S.mt.days.filter((d) => d.date <= td && d.kind !== 'pre').reverse();
    body.innerHTML = `<div class="col" style="gap:14px">${tiles}<div class="col" style="gap:8px">${rows.map((d) => {
      const cls = kindClass(d);
      return `<button class="dayrow" style="border:none;text-align:left" data-a="mtPick" data-v="${d.date}">
        <div class="col" style="width:44px;align-items:center"><span style="font-size:18px;font-weight:700;line-height:1.1">${+d.date.slice(8)}</span><span class="lbl">${esc(L().dows[d.dow])}</span></div>
        <span class="code ${cls}" style="border-width:1.5px">${esc(d.code || '·')}</span>
        <div class="col" style="flex:1;min-width:0"><span class="num" style="font-size:15px;font-weight:600">${d.att ? Calc.bkkTime(d.inAt) + ' – ' + (d.outAt ? Calc.bkkTime(d.outAt) : '??:??') : esc(dayLabel(d))}</span><span class="sub">${esc(d.shift ? S.shifts[d.shift]?.name || '' : '')}</span></div>
        <span style="font-size:12px;font-weight:600;color:${d.kind === 'missing' || d.kind === 'AB' ? 'var(--red)' : d.late ? 'var(--orange)' : 'var(--blue-ink)'}">${esc(dayPill(d))}</span></button>`;
    }).join('')}</div></div>${detailSheet()}`;
    return;
  }
  // calendar
  const from = S.cycle.from, to = S.cycle.to;
  const start = Calc.addDays(from, -Calc.dow(from)), end = Calc.addDays(to, 6 - Calc.dow(to));
  const map = {}; for (const d of S.mt.days) map[d.date] = d;
  let cells = '';
  for (let dt = start; dt <= end; dt = Calc.addDays(dt, 1)) {
    const d = map[dt];
    if (!d) { cells += `<div class="cell k-out"><span class="top"><span class="d">${+dt.slice(8)}</span></span></div>`; continue; }
    const cls = kindClass(d), pill = dayPill(d);
    const fut = d.kind === 'future' && !d.request && !d.holiday;
    cells += `<button class="cell ${cls}${S.mtSel === dt ? ' sel' : ''}" data-a="mtPick" data-v="${dt}" ${fut ? 'disabled' : ''} aria-label="${esc(fmtDate(dt))}">
      <span class="top"><span class="d">${+dt.slice(8)}</span><span class="c">${esc(d.code)}</span></span>
      <span class="t num">${d.att ? Calc.bkkTime(d.inAt) : ''}</span>
      ${d.att ? `<span class="range num">${Calc.bkkTime(d.inAt)} → ${d.outAt ? Calc.bkkTime(d.outAt) : '??:??'}</span>` : ''}
      ${pill ? `<span class="pill">${esc(pill)}</span>` : ''}</button>`;
  }
  const legend = `<div class="legend"><span><i style="background:var(--blue-soft)"></i>${esc(t('legOk'))}</span><span><i style="background:var(--red-soft);border:1.5px solid var(--red)"></i>${esc(t('legMiss'))}</span><span><i style="background:var(--orange-soft)"></i>${esc(t('legLate'))}</span><span><i style="background:var(--amber-soft)"></i>${esc(t('legHol'))}</span><span><i style="background:var(--gray-soft)"></i>${esc(t('legOff'))}</span><span><i style="background:#F1E8FA"></i>${esc(t('legLeave'))}</span><span><i style="background:var(--red)"></i>AB</span></div>`;
  body.innerHTML = `<div class="col" style="gap:12px">${legend}<div class="mt-grid"><div class="card" style="padding:10px 8px"><div class="cal">${L().dows.map((w, k) => `<div class="wd" style="${k === 0 ? 'color:var(--red)' : ''}">${esc(w)}</div>`).join('')}${cells}</div></div>
    <div class="col" style="gap:14px">${detailSheet()}<div class="hide-mobile-tiles">${tiles}</div></div></div></div>`;
  loadDetailPhotos();
}
function detailSheet() {
  const d = S.mt.days.find((x) => x.date === S.mtSel); if (!d) return '';
  const a = d.att;
  const statusMap = { work: d.late ? ['warn', t('late')] : ['ok', t('complete')], missing: ['bad', t('missing')], holiday: ['amber', t('holidayWork')], working: ['ok', t('working')],
    H: ['gray', t('dayOff')], PH: ['gray', t('PH')], PL: ['info', t('PL')], SL: ['info', t('SL')], WOP: ['info', t('WOP')], AB: ['bad', t('absent')], R: ['gray', t('R')], pending: ['gray', t('today')], future: ['gray', ''], pre: ['gray', ''], none: ['gray', t('noRecord')] };
  const st = statusMap[d.kind] || ['gray', ''];
  const sh = d.shift ? S.shifts[d.shift] : null;
  const notes = [];
  if (d.late) notes.push(t('lateMin', { n: d.late }));
  if (d.early) notes.push(t('earlyOut', { n: d.early }));
  if (d.ot1) notes.push(t('otLine', { r: 1, h: d.ot1 }));
  if (d.ot15) notes.push(t('otLine', { r: 1.5, h: d.ot15 }));
  if (d.ot2) notes.push(t('otLine', { r: 2, h: d.ot2 }));
  if (d.ot3) notes.push(t('otLine', { r: 3, h: d.ot3 }));
  if (d.holiday) notes.push(d.holiday);
  if (d.request && d.request.note) notes.push(d.request.note);
  return `<div class="card col" style="gap:10px" id="detail">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="col"><span style="font-size:17px;font-weight:700">${esc(fmtDate(d.date, true))}</span><span class="sub">${esc(d.code || '')}${sh ? ' · ' + esc(sh.name) + ' ' + esc(sh.start_time) + '–' + esc(sh.end_time) : ''}</span></div>${st[1] ? `<span class="chip ${st[0]}">${esc(st[1])}</span>` : ''}</div>
    ${a ? `<div class="grid2">
      <div class="col" style="background:var(--bg);border-radius:12px;padding:10px 12px;gap:6px"><span class="lbl">${esc(t('inT'))}</span><span class="num" style="font-size:22px;font-weight:700">${Calc.bkkTime(d.inAt)}</span>${a.in_photo ? `<img class="photo-thumb" data-photo="${esc(a.in_photo)}" alt="">` : `<div class="photo-none">${esc(t('noPhoto'))}</div>`}</div>
      <div class="col" style="background:var(--bg);border-radius:12px;padding:10px 12px;gap:6px"><span class="lbl">${esc(t('outT'))}</span><span class="num" style="font-size:22px;font-weight:700;color:${d.outAt ? 'var(--ink)' : d.kind === 'missing' ? 'var(--red)' : 'var(--faint)'}">${d.outAt ? Calc.bkkTime(d.outAt) : d.kind === 'missing' ? esc(t('noRecord')) : esc(t('notOut'))}</span>${a.out_photo ? `<img class="photo-thumb" data-photo="${esc(a.out_photo)}" alt="">` : `<div class="photo-none">${esc(t('noPhoto'))}</div>`}</div></div>` : ''}
    ${notes.length ? `<div style="font-size:14px;color:var(--ink2)">${notes.map(esc).join(' · ')}</div>` : ''}
    ${a && (d.kind === 'missing' || d.kind === 'work' || d.kind === 'holiday') ? (a.fix_requested_at ? `<span class="chip info" style="align-self:flex-start">${esc(t('reportSent'))}: ${esc(a.fix_note || '')}</span>` :
      (d.kind === 'missing' ? `<div class="col" style="gap:8px"><input class="input" id="fixNote" placeholder="${esc(t('reportPh'))}" style="font-size:15px;height:46px"><button class="btn navy" style="height:46px;font-size:14px" data-a="fix" data-v="${a.id}">${esc(t('reportAdmin'))}</button></div>` : '')) : ''}
  </div>`;
}
async function loadDetailPhotos() {
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const p = img.dataset.photo;
    const { data } = await sb.storage.from('photos').createSignedUrl(p, 600);
    if (data && data.signedUrl) img.src = data.signedUrl; else img.replaceWith(Object.assign(document.createElement('div'), { className: 'photo-none', textContent: t('noPhoto') }));
  }
}
async function sendFix(id) {
  const note = ($('fixNote') || {}).value || '';
  const { error } = await sb.rpc('request_fix', { p_id: +id, p_note: note });
  if (error) return toast(errMsg(error), true);
  toast(t('reportSent')); await loadMyTime(true);
}

/* ===== Events ===== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'lang') { S.lang = v; store.set('aa_lang', v); if (S.view === 'app' && S.cam) { render(); attachStream(S.cam.stream); renderCamStatus(); } else render(); }
  else if (a === 'goActivate') { S.view = 'activate'; render(); }
  else if (a === 'goLogin') { S.view = 'login'; render(); }
  else if (a === 'tab') { S.tab = v; render(); }
  else if (a === 'logout') logout();
  else if (a === 'cam') openCam(v);
  else if (a === 'camClose') { stopCam(); render(); }
  else if (a === 'pickShift') { S.camShift = v; document.querySelectorAll('.shiftbtn').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); renderCamStatus(); }
  else if (a === 'regps') startGps();
  else if (a === 'shoot') shoot();
  else if (a === 'doneClose') { if (S.done) URL.revokeObjectURL(S.done.url); S.done = null; S.mt = null; render(); }
  else if (a === 'leaveCode') { S.leaveCode = v; S.leaveFrom = $('lf').value; S.leaveTo = $('lt').value; S.leaveNote = $('ln').value; render(); }
  else if (a === 'sendLeave') sendLeave();
  else if (a === 'cancelReq') cancelReq(v);
  else if (a === 'mtView') { S.mtView = v; document.querySelectorAll('[data-a="mtView"]').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); paintMyTime(); }
  else if (a === 'cyc') { S.cycle = Calc.shiftCycle(S.cycle, +v, +(S.settings.cycle_start_day || 26)); S.mt = null; $('mtBody').innerHTML = '<div class="card" style="text-align:center"><span class="spinner dark"></span></div>'; loadMyTime(true); }
  else if (a === 'mtPick') { S.mtSel = v; paintMyTime(); const det = $('detail'); if (det && window.innerWidth < 900) det.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  else if (a === 'fix') sendFix(v);
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'lfile') { S.leaveFile = ev.target.files[0] || null; S.leaveFrom = $('lf').value; S.leaveTo = $('lt').value; S.leaveNote = $('ln').value; render(); }
  if (ev.target.id === 'lf' && $('lt').value < ev.target.value) $('lt').value = ev.target.value;
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'app') { syncTime(); loadRecent().then(() => { if (S.tab === 'time' && !S.cam && !S.done) render(); }); } });
window.addEventListener('pagehide', stopCam);

boot();
</script>
<style>
@media (min-width:900px){.hide-desk,.hide-desk-btn{display:none!important}}
@media (max-width:899px){.hide-mobile-tiles{display:none}}
</style>
